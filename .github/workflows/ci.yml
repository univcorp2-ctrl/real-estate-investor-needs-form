name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show Node version
        run: node --version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Upload Apps Script artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-apps-script-form-generator
          path: |
            google-apps-script/CreateInvestorNeedsForm.gs
            README.md
            docs/setup.md
